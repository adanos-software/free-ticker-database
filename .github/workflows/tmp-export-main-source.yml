name: Temporary export main source

on:
  push:
    branches:
      - agent/tmp-export-main-source
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Package reviewable source
        shell: bash
        run: |
          paths=(.github scripts tests docs README.md requirements.txt)
          [[ -e schema ]] && paths+=(schema)
          [[ -e pyproject.toml ]] && paths+=(pyproject.toml)
          tar -czf main-source.tar.gz "${paths[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: main-source-export
          path: main-source.tar.gz
          if-no-files-found: error
