name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rebuild source-derived artifacts
        run: |
          python scripts/rebuild_dataset.py
          python scripts/build_exchange_source_audit.py

      - name: Rebuild entry quality report for current data
        run: |
          python scripts/build_entry_quality_report.py \
            --csv-out /tmp/entry-quality.csv \
            --json-out /tmp/entry-quality.json \
            --md-out /tmp/entry-quality.md

      - name: Run test suite
        run: python -m pytest tests/ -q

      - name: Check entry quality gate
        run: |
          python scripts/check_entry_quality_gate.py \
            --entry-quality-csv /tmp/entry-quality.csv \
            --no-json-out

      - name: Check README snapshot
        run: |
          python scripts/check_readme_snapshot.py
          python scripts/check_commercial_source_options.py
          python scripts/check_exchange_scope_decisions.py

      - name: Validate database release gates
        run: python scripts/validate_database.py

      - name: Check derived artifacts are current
        run: |
          git diff --exit-code -- \
            data/tickers.csv \
            data/listings.csv \
            data/core_listings.csv \
            data/aliases.csv \
            data/core_aliases.csv \
            data/identifiers.csv \
            data/cross_listings.csv \
            data/instrument_scopes.csv
          python - <<'PY'
          from __future__ import annotations

          import json
          import sqlite3
          from pathlib import Path

          import pyarrow.parquet as pq


          def validate_json(path: str) -> None:
              payload = json.loads(Path(path).read_text(encoding="utf-8"))
              if not payload:
                  raise SystemExit(f"{path} is empty after rebuild")


          def validate_sqlite(path: str) -> None:
              with sqlite3.connect(path) as conn:
                  tables = [
                      row[0]
                      for row in conn.execute(
                          "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name"
                      )
                  ]
                  if not tables:
                      raise SystemExit(f"{path} has no tables after rebuild")
                  for table in tables:
                      count = conn.execute(f'SELECT COUNT(*) FROM "{table}"').fetchone()[0]
                      if count <= 0:
                          raise SystemExit(f"{path} table {table} is empty after rebuild")


          def validate_parquet(path: str) -> None:
              table = pq.read_table(path)
              if table.num_rows <= 0 or table.num_columns <= 0:
                  raise SystemExit(f"{path} is empty after rebuild")


          validate_json("data/tickers.json")
          validate_json("data/core_listings.json")
          validate_sqlite("data/tickers.db")
          validate_parquet("data/tickers.parquet")
          validate_parquet("data/core_listings.parquet")
          PY

      - name: Publish dispatched CI result for branch protection
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CI_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          CI_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$CI_STATE" \
            -f context="test" \
            -f description="Full dispatched CI: $CI_STATE" \
            -f target_url="$CI_TARGET_URL"
