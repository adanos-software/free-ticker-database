name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest tests/ -q

      - name: Check entry quality gate
        run: python scripts/check_entry_quality_gate.py

      - name: Check README snapshot
        run: python scripts/check_readme_snapshot.py

      - name: Validate database release gates
        run: python scripts/validate_database.py

      - name: Check derived artifacts are current
        run: |
          python scripts/rebuild_dataset.py
          git diff --exit-code -- \
            data/tickers.csv \
            data/listings.csv \
            data/core_listings.csv \
            data/aliases.csv \
            data/core_aliases.csv \
            data/tickers.json \
            data/core_listings.json \
            data/identifiers.csv \
            data/cross_listings.csv \
            data/instrument_scopes.csv \
            data/tickers.db \
            data/tickers.parquet \
            data/core_listings.parquet
