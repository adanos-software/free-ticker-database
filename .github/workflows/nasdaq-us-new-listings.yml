name: Daily Nasdaq US New Listings

on:
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  update-nasdaq-us-new-listings:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Snapshot current Nasdaq reference
        run: cp data/masterfiles/reference.csv /tmp/reference-before-nasdaq-us.csv

      - name: Refresh Nasdaq Trader and SEC exchange directories
        run: |
          python scripts/fetch_exchange_masterfiles.py \
            --source nasdaq_listed \
            --source nasdaq_other_listed \
            --source sec_company_tickers_exchange

      - name: Apply safe new US stock and ETF listings
        id: apply
        run: |
          python scripts/apply_nasdaq_us_new_listings.py \
            --previous-reference /tmp/reference-before-nasdaq-us.csv \
            --asset-type Stock,ETF

      - name: Rebuild derived exports and reports
        if: steps.apply.outputs.new_listings_applied == 'true'
        run: |
          cp data/listings.csv /tmp/listings-before.csv
          python scripts/rebuild_canonical.py
          python scripts/check_safe_merge.py \
            --before /tmp/listings-before.csv \
            --after data/listings.csv \
            --events data/history/listing_events.csv \
            --previous-official-reference /tmp/reference-before-nasdaq-us.csv \
            --strict
          python scripts/enrich_global_identifiers.py
          python scripts/build_entry_quality_report.py
          python scripts/build_coverage_report.py
          python scripts/build_source_inventory.py
          python scripts/build_exchange_source_audit.py
          python scripts/build_source_gap_classification.py
          python scripts/build_source_of_truth_decisions.py
          python scripts/build_completion_backlog.py
          python scripts/build_alias_quality_report.py
          python scripts/build_adanos_ticker_reference.py
          python scripts/update_readme_snapshot.py

      - name: Validate technical release gates
        if: steps.apply.outputs.new_listings_applied == 'true'
        run: |
          python -m pytest tests/ -q
          python scripts/check_readme_snapshot.py
          python scripts/check_commercial_source_options.py
          python scripts/check_exchange_scope_decisions.py

      - name: Check entry quality gate
        if: steps.apply.outputs.new_listings_applied == 'true'
        id: entry_quality_gate
        continue-on-error: true
        run: |
          rm -f data/reports/entry_quality_gate.json
          python scripts/check_entry_quality_gate.py

      - name: Validate database release gates
        if: steps.apply.outputs.new_listings_applied == 'true'
        id: database_gates
        continue-on-error: true
        run: |
          rm -f data/reports/validation_report.json
          python scripts/validate_database.py

      - name: Classify release gate result
        if: steps.apply.outputs.new_listings_applied == 'true'
        id: release
        run: |
          python scripts/classify_masterfile_rotation_gates.py \
            --entry-quality-gate data/reports/entry_quality_gate.json \
            --validation-report data/reports/validation_report.json \
            --entry-quality-outcome "${{ steps.entry_quality_gate.outcome }}" \
            --database-outcome "${{ steps.database_gates.outcome }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Summarize manual data review
        if: >-
          steps.apply.outputs.new_listings_applied == 'true' &&
          steps.release.outputs.review_required == 'true'
        run: |
          {
            echo "### Nasdaq refresh needs data review"
            echo
            echo "The refresh completed technically, but introduced ${{ steps.release.outputs.unexpected_warn_count }} new entry-quality warning(s)."
            echo "The generated data diff will be preserved in a draft pull request instead of failing the scheduled workflow."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Detect substantive changes
        id: changes
        run: |
          if [ "${{ steps.apply.outputs.new_listings_applied }}" != "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No accepted Nasdaq US listings; skipping PR."
          elif git diff --quiet -- \
            data/masterfiles/reference.csv \
            data/masterfiles/summary.json \
            data/masterfiles/sources.json \
            data/masterfiles/supplemental_listings.csv \
            data/reports/nasdaq_us_new_listings_apply.json \
            data/reports/nasdaq_us_new_listings_apply.md \
            data/ README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No Nasdaq US listing changes; skipping PR."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open update pull request
        if: steps.changes.outputs.changed == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ github.token }}
          branch: automation/nasdaq-us-new-listings
          delete-branch: true
          commit-message: Update Nasdaq US new listings
          title: "Update Nasdaq US new listings"
          draft: ${{ (steps.release.outputs.review_required == 'true' || steps.apply.outputs.coverage_expansion_rows != '0') && 'always-true' || 'false' }}
          body: |
            Automated Nasdaq Trader US listing refresh.

            This refresh:
            - updates `nasdaq_listed` and `nasdaq_other_listed` in `data/masterfiles/reference.csv`
            - routes newly active US `Stock` and `ETF` rows to normal supplements when identity is stable
            - routes distinct same-ticker securities to collision-safe `data/coverage_expansion_listings.csv`
            - rebuilds public exports and reports when rows are accepted

            Guardrails:
            - no backlog catch-up: only rows newly active versus the previous committed reference snapshot are eligible
            - exact venue/ticker duplicates remain blocked; cross-security ticker collisions cannot replace the global primary
            - same-security venue moves and ticker renames preserve unique peer metadata
            - potentially foreign share lines do not receive an unsupported US domicile default
            - no Units, Rights, Warrants, Preferreds, Notes, or non-stock-like names

            Entry-quality review required: `${{ steps.release.outputs.review_required }}`
            Unexpected entry-quality warnings: `${{ steps.release.outputs.unexpected_warn_count }}`

            Apply report: `data/reports/nasdaq_us_new_listings_apply.md`

      - name: Require manual review for data warnings or listing collisions
        if: >-
          steps.cpr.outputs.pull-request-number != '' &&
          (steps.release.outputs.review_required == 'true' ||
          steps.apply.outputs.coverage_expansion_rows != '0')
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          gh label create automation-review-required \
            --color D4C5F9 \
            --description "Automation data changes require manual review" \
            --force
          gh pr edit "$PR_NUMBER" --add-label automation-review-required
          if [ "$(gh pr view "$PR_NUMBER" --json autoMergeRequest --jq '.autoMergeRequest != null')" = "true" ]; then
            gh pr merge "$PR_NUMBER" --disable-auto
          fi
          if [ "$(gh pr view "$PR_NUMBER" --json isDraft --jq '.isDraft')" != "true" ]; then
            gh pr ready "$PR_NUMBER" --undo
          fi

      - name: Restore pull request after review conditions clear
        if: >-
          steps.cpr.outputs.pull-request-number != '' &&
          steps.release.outputs.review_required != 'true' &&
          steps.apply.outputs.coverage_expansion_rows == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          if [ "$(gh pr view "$PR_NUMBER" --json labels --jq 'any(.labels[]; .name == "automation-review-required")')" = "true" ]; then
            if [ "$(gh pr view "$PR_NUMBER" --json isDraft --jq '.isDraft')" = "true" ]; then
              gh pr ready "$PR_NUMBER"
            fi
            gh pr edit "$PR_NUMBER" --remove-label automation-review-required
          fi

      - name: Dispatch CI for automation pull request
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref automation/nasdaq-us-new-listings

      - name: Enable automerge
        if: >-
          steps.cpr.outputs.pull-request-number != '' &&
          steps.release.outputs.review_required != 'true' &&
          steps.apply.outputs.coverage_expansion_rows == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" --auto --squash
