name: Weekly Delisting Candidates

on:
  schedule:
    - cron: "41 7 * * 1"   # Mondays 07:41 UTC (after the drift report)
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  delisting-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build delisting-candidate report
        id: delist
        run: python scripts/build_delisting_report.py

      - name: Validate delisting report logic
        run: python -m pytest tests/test_build_delisting_report.py -q

      - name: Apply verified delisting classes
        id: apply
        run: python scripts/apply_delistings.py --apply

      - name: Rebuild derived exports and reports
        if: steps.apply.outputs.delistings_applied == 'true'
        run: |
          python scripts/rebuild_dataset.py
          python scripts/enrich_global_identifiers.py
          python scripts/build_entry_quality_report.py
          python scripts/build_coverage_report.py
          python scripts/build_source_inventory.py
          python scripts/build_source_gap_classification.py
          python scripts/build_source_of_truth_decisions.py
          python scripts/build_completion_backlog.py
          python scripts/build_alias_quality_report.py
          python scripts/build_adanos_ticker_reference.py
          python scripts/update_readme_snapshot.py

      - name: Validate delisting apply
        if: steps.apply.outputs.delistings_applied == 'true'
        run: |
          python -m pytest tests/ -q
          python scripts/check_entry_quality_gate.py
          python scripts/check_readme_snapshot.py
          python scripts/validate_database.py

      - name: Open delisting-review pull request
        if: steps.delist.outputs.delisting_detected == 'true' || steps.apply.outputs.delistings_applied == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ github.token }}
          branch: automation/delisting-report
          delete-branch: true
          commit-message: Update weekly delisting-candidate report
          title: "Weekly delisting-candidate report"
          body: |
            Automated weekly delisting check. Diffs our primary stock holdings
            against board-complete official exchange masters (US NASDAQ Trader,
            JP JPX data_j, AU ASX, IN-NSE EQUITY_L+SME, IN-BSE ListofScripData
            with authoritative status). A failed master fetch skips that market
            (never emits false candidates).

            **Detection only — nothing is auto-applied.** Triage each candidate:
            - `delisted` (BSE authoritative status) → applied as a gated drop override
            - `master_absent` → verify rename vs delisting before acting (renames
              re-key/dedup; genuine delistings drop)
            - `suspended` (BSE) → kept by policy (can resume)

            Report: `data/reports/delisting_report.md` / `.json`
            Apply report: `data/reports/delisting_apply.md` / `.json`

      - name: Dispatch CI for automation pull request
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref automation/delisting-report

      - name: Enable automerge
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" --auto --squash
