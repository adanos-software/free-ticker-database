name: Publish verified PR 233 test status

on:
  push:
    branches:
      - agent/canonical-v4-materializer-20260817
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: 21c09ce55167ae57c2ad1ca6709e6d48a2a268e3
      VERIFIED_RUN_ID: "32066864747"
      VERIFIED_RUN_URL: https://github.com/adanos-software/free-ticker-database/actions/runs/32066864747
    steps:
      - name: Verify exact successful CI run
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${VERIFIED_RUN_ID}" > /tmp/run.json
          jq -e --arg sha "$TARGET_SHA" '
            .head_sha == $sha and
            .status == "completed" and
            .conclusion == "success" and
            .event == "pull_request"
          ' /tmp/run.json

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${VERIFIED_RUN_ID}/jobs?per_page=100" > /tmp/jobs.json
          jq -e '
            ([.jobs[] | select(.name == "Compatibility dataset" and .status == "completed" and .conclusion == "success")] | length) == 1 and
            ([.jobs[] | select(.name == "Canonical v4 foundation" and .status == "completed" and .conclusion == "success")] | length) == 1
          ' /tmp/jobs.json

      - name: Publish required legacy status context
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state=success \
            -f context=test \
            -f description="Full PR CI passed" \
            -f target_url="$VERIFIED_RUN_URL"
