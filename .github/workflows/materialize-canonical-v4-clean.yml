name: Repair PR 233 checked-in files

on:
  push:
    branches:
      - agent/canonical-v4-materializer-20260817
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr-233-file-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: agent/canonical-v4-clean
          fetch-depth: 4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore and regenerate README
        run: |
          git cat-file -e 339a561bf081285aa96d73a737ef38bc016ff6e5^{commit}
          git show 339a561bf081285aa96d73a737ef38bc016ff6e5:README.md > README.md
          python scripts/update_readme_snapshot.py
          python - <<'PY'
          from pathlib import Path

          text = Path("README.md").read_text(encoding="utf-8")
          if "�" in text:
              raise SystemExit("README contains replacement characters")
          PY
          python scripts/check_readme_snapshot.py

      - name: Update strict provenance fixtures
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_safe_merge.py")
          source = path.read_text(encoding="utf-8")
          marker = '"observation_id": f"delisting-{value[\'listing_key\']}"'
          if marker not in source:
              old = '        "source_url": "https://exchange.example/notices/A", "evidence_status": "official",\n'
              new = (
                  '        "source_url": "https://exchange.example/notices/A",\n'
                  '        "observation_id": f"delisting-{value[\'listing_key\']}", '
                  '"evidence_status": "official",\n'
              )
              if source.count(old) != 1:
                  raise SystemExit("safe-merge fixture target missing or ambiguous")
              source = source.replace(old, new, 1)
              path.write_text(source, encoding="utf-8")
          PY

      - name: Verify focused fixes
        run: |
          python -m compileall -q scripts tests
          python -m pytest -q \
            tests/test_safe_merge.py \
            tests/test_dataset_quality.py::test_readme_stats_and_claims_are_current \
            tests/test_dataset_quality.py::test_open_source_project_files_exist_and_are_linked
          git diff --check
          git diff -- README.md tests/test_safe_merge.py

      - name: Commit exact reviewed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md tests/test_safe_merge.py
          git diff --cached --check
          git commit -m "Fix README encoding and safe-merge test provenance"
          git push origin HEAD:agent/canonical-v4-clean

      - name: Diagnose remaining canonical validation gates
        run: |
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          python scripts/rebuild_canonical.py
          python scripts/validate_database.py || true
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("data/reports/validation_report.json").read_text(encoding="utf-8"))
          failed = [
              gate
              for gate in report.get("gates", [])
              if gate.get("severity") == "error" and not gate.get("passed")
          ]
          print(json.dumps({"failed_error_gates": failed}, indent=2, ensure_ascii=False))
          if not failed:
              print("No validation failures remain.")
          PY
