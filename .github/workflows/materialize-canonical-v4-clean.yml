name: Synchronize PR 233 canonical dependents

on:
  push:
    branches:
      - agent/canonical-v4-materializer-20260817
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr-233-canonical-dependent-sync
  cancel-in-progress: true

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: agent/canonical-v4-clean
          fetch-depth: 3

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Patch canonical dependent synchronization
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/rebuild_canonical.py")
          source = path.read_text(encoding="utf-8")

          old_imports = '''        build_canonical_v4, build_coverage_contracts, build_coverage_report,
        build_exchange_source_audit, build_listing_history, build_reference_reconciliation,
        enrich_global_identifiers, normalize_source_registry,
'''
          new_imports = '''        build_adanos_ticker_reference, build_canonical_v4, build_coverage_contracts,
        build_coverage_report, build_entry_quality_report, build_exchange_source_audit,
        build_listing_history, build_reference_reconciliation,
        build_source_gap_classification, build_source_of_truth_decisions,
        enrich_global_identifiers, normalize_source_registry,
'''
          if source.count(old_imports) != 1:
              raise SystemExit("package import target missing or ambiguous")
          source = source.replace(old_imports, new_imports, 1)

          old_fallback = '''    import build_canonical_v4
    import build_coverage_contracts
    import build_coverage_report
    import build_exchange_source_audit
    import build_listing_history
    import build_reference_reconciliation
    import enrich_global_identifiers
    import normalize_source_registry
'''
          new_fallback = '''    import build_adanos_ticker_reference
    import build_canonical_v4
    import build_coverage_contracts
    import build_coverage_report
    import build_entry_quality_report
    import build_exchange_source_audit
    import build_listing_history
    import build_reference_reconciliation
    import build_source_gap_classification
    import build_source_of_truth_decisions
    import enrich_global_identifiers
    import normalize_source_registry
'''
          if source.count(old_fallback) != 1:
              raise SystemExit("direct-execution import target missing or ambiguous")
          source = source.replace(old_fallback, new_fallback, 1)

          helper_anchor = '''def rebuild(
    *, apply_identity_fixes: bool = False, apply_official_name_updates: bool = False
) -> dict[str, Any]:
'''
          helper = '''def rebuild_validation_dependents() -> None:
    """Regenerate every validator input derived from the rebuilt current dataset."""

    build_entry_quality_report.main([])
    build_source_gap_classification.main([])
    build_source_of_truth_decisions.main([])
    if build_adanos_ticker_reference.main([]) != 0:
        raise SystemExit("Adanos ticker reference rebuild failed")


'''
          if source.count(helper_anchor) != 1:
              raise SystemExit("rebuild helper anchor missing or ambiguous")
          source = source.replace(helper_anchor, helper + helper_anchor, 1)

          call_anchor = '''    build_coverage_report.build_report()
    if build_exchange_source_audit.main([]) != 0:
        raise SystemExit("exchange source audit failed")
    evidence_as_of = _built_at_datetime()
'''
          call_replacement = '''    build_coverage_report.build_report()
    if build_exchange_source_audit.main([]) != 0:
        raise SystemExit("exchange source audit failed")
    rebuild_validation_dependents()
    evidence_as_of = _built_at_datetime()
'''
          if source.count(call_anchor) != 1:
              raise SystemExit("dependent synchronization call anchor missing or ambiguous")
          source = source.replace(call_anchor, call_replacement, 1)
          path.write_text(source, encoding="utf-8")

          test_path = Path("tests/test_rebuild_canonical_foundation.py")
          test_source = test_path.read_text(encoding="utf-8")
          test_name = "test_validation_dependents_are_rebuilt_in_dependency_order"
          if test_name not in test_source:
              test_source += '''


def test_validation_dependents_are_rebuilt_in_dependency_order(monkeypatch) -> None:
    calls: list[str] = []
    monkeypatch.setattr(canonical.build_entry_quality_report, "main", lambda argv: calls.append("entry_quality"))
    monkeypatch.setattr(canonical.build_source_gap_classification, "main", lambda argv: calls.append("source_gap"))
    monkeypatch.setattr(canonical.build_source_of_truth_decisions, "main", lambda argv: calls.append("source_truth"))
    monkeypatch.setattr(
        canonical.build_adanos_ticker_reference,
        "main",
        lambda argv: calls.append("adanos") or 0,
    )

    canonical.rebuild_validation_dependents()

    assert calls == ["entry_quality", "source_gap", "source_truth", "adanos"]
'''
              test_path.write_text(test_source, encoding="utf-8")
          PY

      - name: Verify source changes
        run: |
          python -m compileall -q scripts tests
          python -m pytest -q tests/test_rebuild_canonical_foundation.py
          git diff --check
          git diff -- scripts/rebuild_canonical.py tests/test_rebuild_canonical_foundation.py

      - name: Run complete canonical validation
        run: |
          python scripts/rebuild_canonical.py
          python scripts/validate_database.py
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          with Path("data/tickers.csv").open(newline="", encoding="utf-8") as handle:
              ticker_count = sum(1 for _ in csv.DictReader(handle))
          with Path("data/adanos/ticker_reference.csv").open(newline="", encoding="utf-8") as handle:
              adanos_count = sum(1 for _ in csv.DictReader(handle))
          report = json.loads(Path("data/reports/validation_report.json").read_text(encoding="utf-8"))
          failed = [gate for gate in report.get("gates", []) if gate.get("severity") == "error" and not gate.get("passed")]
          if ticker_count != adanos_count:
              raise SystemExit(f"Adanos row-count mismatch after rebuild: {adanos_count} != {ticker_count}")
          if failed:
              raise SystemExit(json.dumps(failed, indent=2, ensure_ascii=False))
          print(json.dumps({"tickers": ticker_count, "adanos": adanos_count, "failed_error_gates": 0}, indent=2))
          PY

      - name: Run complete test suite
        run: python -m pytest tests/ -q

      - name: Commit source-only fix
        run: |
          git reset --hard HEAD
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/rebuild_canonical.py")
          source = path.read_text(encoding="utf-8")
          old_imports = '''        build_canonical_v4, build_coverage_contracts, build_coverage_report,
        build_exchange_source_audit, build_listing_history, build_reference_reconciliation,
        enrich_global_identifiers, normalize_source_registry,
'''
          new_imports = '''        build_adanos_ticker_reference, build_canonical_v4, build_coverage_contracts,
        build_coverage_report, build_entry_quality_report, build_exchange_source_audit,
        build_listing_history, build_reference_reconciliation,
        build_source_gap_classification, build_source_of_truth_decisions,
        enrich_global_identifiers, normalize_source_registry,
'''
          source = source.replace(old_imports, new_imports, 1)
          old_fallback = '''    import build_canonical_v4
    import build_coverage_contracts
    import build_coverage_report
    import build_exchange_source_audit
    import build_listing_history
    import build_reference_reconciliation
    import enrich_global_identifiers
    import normalize_source_registry
'''
          new_fallback = '''    import build_adanos_ticker_reference
    import build_canonical_v4
    import build_coverage_contracts
    import build_coverage_report
    import build_entry_quality_report
    import build_exchange_source_audit
    import build_listing_history
    import build_reference_reconciliation
    import build_source_gap_classification
    import build_source_of_truth_decisions
    import enrich_global_identifiers
    import normalize_source_registry
'''
          source = source.replace(old_fallback, new_fallback, 1)
          helper_anchor = '''def rebuild(
    *, apply_identity_fixes: bool = False, apply_official_name_updates: bool = False
) -> dict[str, Any]:
'''
          helper = '''def rebuild_validation_dependents() -> None:
    """Regenerate every validator input derived from the rebuilt current dataset."""

    build_entry_quality_report.main([])
    build_source_gap_classification.main([])
    build_source_of_truth_decisions.main([])
    if build_adanos_ticker_reference.main([]) != 0:
        raise SystemExit("Adanos ticker reference rebuild failed")


'''
          source = source.replace(helper_anchor, helper + helper_anchor, 1)
          call_anchor = '''    build_coverage_report.build_report()
    if build_exchange_source_audit.main([]) != 0:
        raise SystemExit("exchange source audit failed")
    evidence_as_of = _built_at_datetime()
'''
          call_replacement = '''    build_coverage_report.build_report()
    if build_exchange_source_audit.main([]) != 0:
        raise SystemExit("exchange source audit failed")
    rebuild_validation_dependents()
    evidence_as_of = _built_at_datetime()
'''
          source = source.replace(call_anchor, call_replacement, 1)
          path.write_text(source, encoding="utf-8")

          test_path = Path("tests/test_rebuild_canonical_foundation.py")
          test_source = test_path.read_text(encoding="utf-8")
          if "test_validation_dependents_are_rebuilt_in_dependency_order" not in test_source:
              test_source += '''


def test_validation_dependents_are_rebuilt_in_dependency_order(monkeypatch) -> None:
    calls: list[str] = []
    monkeypatch.setattr(canonical.build_entry_quality_report, "main", lambda argv: calls.append("entry_quality"))
    monkeypatch.setattr(canonical.build_source_gap_classification, "main", lambda argv: calls.append("source_gap"))
    monkeypatch.setattr(canonical.build_source_of_truth_decisions, "main", lambda argv: calls.append("source_truth"))
    monkeypatch.setattr(canonical.build_adanos_ticker_reference, "main", lambda argv: calls.append("adanos") or 0)
    canonical.rebuild_validation_dependents()
    assert calls == ["entry_quality", "source_gap", "source_truth", "adanos"]
'''
              test_path.write_text(test_source, encoding="utf-8")
          PY
          python -m compileall -q scripts tests
          python -m pytest -q tests/test_rebuild_canonical_foundation.py
          git add scripts/rebuild_canonical.py tests/test_rebuild_canonical_foundation.py
          git diff --cached --check
          git commit -m "Synchronize canonical validation dependents"
          git push origin HEAD:agent/canonical-v4-clean
