name: Publish tested PR 233 canonical sync

on:
  push:
    branches:
      - agent/canonical-v4-materializer-20260817
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr-233-canonical-sync-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transport script
        uses: actions/checkout@v6
        with:
          ref: agent/canonical-v4-materializer-20260817
          path: transport
          fetch-depth: 1

      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: agent/canonical-v4-clean
          path: target
          fetch-depth: 3

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: target
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply exact tested source patch
        working-directory: target
        run: python ../transport/.transport/apply_pr233_canonical_sync.py

      - name: Verify and publish
        working-directory: target
        run: |
          python -m compileall -q scripts tests
          python -m pytest -q tests/test_rebuild_canonical_foundation.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/rebuild_canonical.py tests/test_rebuild_canonical_foundation.py
          git diff --cached --check
          git commit -m "Synchronize canonical validation dependents"
          git push origin HEAD:agent/canonical-v4-clean
