name: Daily Masterfile Rotation

on:
  schedule:
    - cron: "07 6 * * *"
    - cron: "17 10 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: How to select official sources
        type: choice
        options:
          - rotation
          - sources
          - stale
        default: rotation
      source_keys:
        description: Comma-separated source keys (mode=sources)
        type: string
        required: false
      batch_size:
        description: Rotation batch size (mode=rotation)
        type: string
        default: "20"

concurrency:
  group: masterfile-rotation
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.skip.outputs.skip }}
    steps:
      - name: Skip if a rotation pull request is already open
        id: skip
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          open_pr=$(gh pr list --repo "$GH_REPO" --head automation/masterfile-rotation --state open --json number --jq '.[0].number // empty')
          if [ -n "$open_pr" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "open_pr=$open_pr" >> "$GITHUB_OUTPUT"
            {
              echo "### Masterfile rotation skipped"
              echo
              echo "Pull request #$open_pr is still open on \`automation/masterfile-rotation\`."
              echo "This run did not fetch a new batch so the open rotation is not overwritten."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  rotate-masterfiles:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Snapshot current masterfile reference
        run: cp data/masterfiles/reference.csv /tmp/reference-before-masterfile-rotation.csv

      - name: Refresh scheduled source batch
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode || (github.event.schedule == '17 10 * * 1' && 'stale') || 'rotation' }}
          SOURCE_KEYS: ${{ github.event.inputs.source_keys }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '20' }}
        run: |
          set -euo pipefail
          mode="${MODE:-rotation}"
          batch_size="${BATCH_SIZE:-20}"
          if ! [[ "$batch_size" =~ ^[1-9][0-9]*$ ]]; then
            echo "batch_size must be a positive integer, got: $batch_size" >&2
            exit 1
          fi
          case "$mode" in
            sources)
              if ! [[ "${SOURCE_KEYS:-}" =~ [^,[:space:]] ]]; then
                echo "mode=sources requires source_keys" >&2
                exit 1
              fi
              python scripts/fetch_exchange_masterfiles.py --source "$SOURCE_KEYS"
              ;;
            rotation)
              python scripts/fetch_exchange_masterfiles.py --rotation-batch-size "$batch_size"
              ;;
            stale)
              python scripts/fetch_exchange_masterfiles.py --stale-or-unavailable --rotation-batch-size "$batch_size"
              ;;
            *)
              echo "Unknown mode: $mode" >&2
              exit 1
              ;;
          esac

      - name: Build masterfile rotation diff
        run: |
          python scripts/build_masterfile_diff_report.py \
            --previous-reference /tmp/reference-before-masterfile-rotation.csv

      - name: Classify vanished official-reference rows
        run: python scripts/build_masterfile_vanished_delisting_review.py

      - name: Apply safe new US stock and ETF listings
        id: apply
        run: |
          python scripts/apply_nasdaq_us_new_listings.py \
            --previous-reference /tmp/reference-before-masterfile-rotation.csv \
            --asset-type Stock,ETF

      - name: Rebuild derived exports and reports
        run: |
          cp data/listings.csv /tmp/listings-before.csv
          python scripts/rebuild_canonical.py
          python scripts/build_entry_quality_report.py
          python scripts/backfill_official_name_mismatches.py --exchange ASX
          python scripts/rebuild_canonical.py
          python scripts/enrich_global_identifiers.py
          python scripts/build_entry_quality_report.py
          python scripts/build_coverage_report.py
          python scripts/build_source_inventory.py
          python scripts/build_exchange_source_audit.py
          python scripts/build_source_gap_classification.py
          python scripts/build_source_of_truth_decisions.py
          python scripts/build_completion_backlog.py
          python scripts/build_alias_quality_report.py
          python scripts/build_adanos_ticker_reference.py
          python scripts/update_readme_snapshot.py

      - name: Enforce safe merge gate
        id: safe_merge
        continue-on-error: true
        run: |
          rm -f data/reports/safe_merge.json
          python scripts/check_safe_merge.py \
            --before /tmp/listings-before.csv \
            --after data/listings.csv \
            --events data/history/listing_events.csv \
            --previous-official-reference /tmp/reference-before-masterfile-rotation.csv \
            --strict

      - name: Validate technical release gates
        run: |
          python -m pytest tests/ -q
          python scripts/check_readme_snapshot.py
          python scripts/check_commercial_source_options.py
          python scripts/check_exchange_scope_decisions.py

      - name: Check entry quality gate
        id: entry_quality_gate
        continue-on-error: true
        run: |
          rm -f data/reports/entry_quality_gate.json
          python scripts/check_entry_quality_gate.py

      - name: Validate database release gates
        id: database_gates
        continue-on-error: true
        run: |
          rm -f data/reports/validation_report.json
          python scripts/validate_database.py

      - name: Classify release gate result
        id: release
        run: |
          python scripts/classify_masterfile_rotation_gates.py \
            --entry-quality-gate data/reports/entry_quality_gate.json \
            --validation-report data/reports/validation_report.json \
            --entry-quality-outcome "${{ steps.entry_quality_gate.outcome }}" \
            --database-outcome "${{ steps.database_gates.outcome }}" \
            --safe-merge-outcome "${{ steps.safe_merge.outcome }}" \
            --masterfile-summary data/masterfiles/summary.json \
            --rotation-diff data/reports/masterfile_rotation_diff.json \
            --safe-merge data/reports/safe_merge.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Summarize fetch issues
        if: steps.release.outputs.fetch_issue_count != '0'
        run: |
          {
            echo "### Official source fetch issues"
            echo
            echo "Preserved last committed rows for ${{ steps.release.outputs.fetch_issue_count }} source(s): ${{ steps.release.outputs.fetch_issue_keys }}."
            echo "Fetch misses are ops notes, not identity review, and do not draft the rotation pull request."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize manual data review
        if: steps.release.outputs.review_required == 'true'
        run: |
          {
            echo "### Masterfile rotation needs data review"
            echo
            echo "The refresh completed technically, but introduced ${{ steps.release.outputs.unexpected_warn_count }} new entry-quality warning(s)."
            echo "Critical masterfile field changes requiring review: ${{ steps.release.outputs.critical_rotation_change_count }}."
            echo "Unevidenced listing field changes requiring review: ${{ steps.release.outputs.unevidenced_listing_field_change_count }}."
            echo "A substantive generated data diff will be preserved in a draft pull request; source-only review without data changes remains summary-only."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Detect substantive changes
        id: changes
        run: |
          python - <<'PY' > /tmp/masterfile-diff-counts
          import json
          report = json.load(open("data/reports/masterfile_rotation_diff.json", encoding="utf-8"))
          summary = report["summary"]
          count = summary["new_rows"] + summary["vanished_rows"] + summary["changed_rows"]
          print(count)
          PY
          diff_count=$(cat /tmp/masterfile-diff-counts)
          if [ "$diff_count" = "0" ] \
            && [ "${{ steps.apply.outputs.new_listings_applied }}" != "true" ] \
            && [ "${{ steps.release.outputs.unexpected_warn_count }}" = "0" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No masterfile row diffs, accepted listings, or unexpected warnings; skipping PR (timestamp-only churn discarded; source-only review remains in the summary)."
          elif [ "${{ steps.release.outputs.review_required }}" != "true" ] && git diff --quiet -- \
            data/masterfiles/reference.csv \
            data/masterfiles/sources.json \
            data/masterfiles/supplemental_listings.csv \
            data/ README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Masterfile diff/apply reported no substantive data diff; skipping PR."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open update pull request
        if: steps.changes.outputs.changed == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ github.token }}
          branch: automation/masterfile-rotation
          delete-branch: true
          commit-message: Rotate official masterfile batch
          title: "${{ steps.release.outputs.review_required == 'true' && 'Review official masterfile rotation' || 'Rotate official masterfile batch' }}"
          draft: ${{ steps.release.outputs.review_required == 'true' }}
          body: |
            Automated official masterfile rotation.

            This refresh:
            - rotates a deterministic batch of official source parsers
            - emits new, vanished, name, ISIN, and field-change diffs
            - applies only collision-free new US Stock/ETF listings

            Vanished listings are reported for delisting classification and are
            never directly deleted by this workflow.

            Fetch issues (preserved last committed rows, not identity review): `${{ steps.release.outputs.fetch_issue_count }}` (${{ steps.release.outputs.fetch_issue_keys }})
            Entry-quality review required: `${{ steps.release.outputs.review_required }}`
            Unexpected entry-quality warnings: `${{ steps.release.outputs.unexpected_warn_count }}`
            Critical masterfile field changes: `${{ steps.release.outputs.critical_rotation_change_count }}`
            Unevidenced listing field changes: `${{ steps.release.outputs.unevidenced_listing_field_change_count }}`

            Draft review PRs are not dispatched to CI or enabled for automerge.

            Diff report: `data/reports/masterfile_rotation_diff.md`
            Apply report: `data/reports/nasdaq_us_new_listings_apply.md`

      - name: Synchronize pull request review state
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          if [ "${{ steps.release.outputs.review_required }}" = "true" ]; then
            gh label create automation-review-required \
              --color D4C5F9 \
              --description "Automation data changes require manual review" \
              --force
            gh pr edit "$PR_NUMBER" --add-label automation-review-required
            if [ "$(gh pr view "$PR_NUMBER" --json isDraft --jq '.isDraft')" != "true" ]; then
              gh pr ready "$PR_NUMBER" --undo
            fi
          elif [ "$(gh pr view "$PR_NUMBER" --json labels --jq 'any(.labels[]; .name == "automation-review-required")')" = "true" ]; then
            if [ "$(gh pr view "$PR_NUMBER" --json isDraft --jq '.isDraft')" = "true" ]; then
              gh pr ready "$PR_NUMBER"
            fi
            gh pr edit "$PR_NUMBER" --remove-label automation-review-required
          fi

      - name: Dispatch CI for automation pull request
        if: steps.cpr.outputs.pull-request-number != '' && steps.release.outputs.review_required != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref automation/masterfile-rotation

      - name: Enable automerge
        if: steps.cpr.outputs.pull-request-number != '' && steps.release.outputs.review_required != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" --auto --squash
